<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Nawa — 에이전트 통합 관리</title>
    <meta name="description" content="조직에 등록된 에이전트를 플랫폼에 관계없이 한 곳에서 검색하고 관리합니다.">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><i class="fas fa-people-group"></i> Agent Nawa</div>
            <nav class="nav">
                <a href="#/overview" class="nav-item" data-view="overview"><i class="fas fa-gauge-high"></i> Overview</a>
                <a href="#/agents" class="nav-item" data-view="agents"><i class="fas fa-robot"></i> Agents</a>
                <a href="#/sources" class="nav-item" data-view="sources"><i class="fas fa-plug"></i> Sources</a>
            </nav>
        </aside>

        <main class="content">
            <div id="view-root">
                <div class="loading">Loading agents...</div>
            </div>
        </main>
    </div>

    <!-- agent detail flyout -->
    <div id="flyout-backdrop" class="flyout-backdrop" hidden></div>
    <aside id="flyout" class="flyout" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="에이전트 상세"></aside>

    <script src="/static/script.js"></script>
</body>

</html>
