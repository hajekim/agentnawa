<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Directory - 통합 에이전트 관리</title>
    <meta name="description" content="조직에 등록된 에이전트를 플랫폼에 관계없이 한 곳에서 검색하고 실행합니다.">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>Agent Directory</h1>
                <p>조직에 등록된 에이전트를 플랫폼에 관계없이 한 곳에서 검색하고 실행합니다.</p>
            </div>
            <div class="header-right">
                <input type="search" id="search" class="search-input" placeholder="에이전트 검색 (이름·설명·타입)" aria-label="에이전트 검색">
            </div>
        </header>

        <div id="provider-health" class="provider-health"></div>

        <main class="grid" id="agent-grid">
            <div class="loading">Loading agents...</div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>

</html>
